name: Cloud Android Build (Direct)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Install Expo UI dependencies
        run: pnpm add expo-blur expo-linear-gradient babel-preset-expo

      - name: Type Check
        run: pnpm tsc --noEmit

      - name: Generate Android Source (Prebuild)
        run: npx expo prebuild --platform android

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflinePlayer-APK
          path: android/app/build/outputs/apk/release/app-release.apk
